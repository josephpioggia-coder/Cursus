
[functions.creer-session-checkout]
enabled = true
verify_jwt = false
import_map = "./functions/creer-session-checkout/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/creer-session-checkout/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/creer-session-checkout/*.html" ]

[functions.stripe-webhook]
enabled = true
# false : Stripe n'envoie pas de jeton Supabase, seulement un header
# stripe-signature vérifié dans le code lui-même (stripe.webhooks.constructEventAsync).
verify_jwt = false
import_map = "./functions/stripe-webhook/deno.json"
entrypoint = "./functions/stripe-webhook/index.ts"

[functions.admin-codes-promo]
enabled = true
# false : la vérification d'identité (admin ou non) est faite dans le
# code lui-même (supabase.auth.getUser + table admins), pas au niveau
# de la passerelle Supabase.
verify_jwt = false
import_map = "./functions/admin-codes-promo/deno.json"
entrypoint = "./functions/admin-codes-promo/index.ts"
